<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B2770">
<title>Kindred · Friends who actually get you</title>
<style>
:root{--ink:#2B2770;--ink2:#5B50E0;--lav:#EEEAFE;--lav2:#C9BEFF;--coral:#FF7A6B;--mint:#34D399;--mintd:#047857;--bg:#F7F6FC;--slate:#6B7894;--slate2:#475569;--muted:#9AA5BC;--line:#E6E8F0;--chip:#F1F2F9;--star:#F5B301}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--slate2);font:15px/1.45 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#app{max-width:520px;margin:0 auto;padding:0 16px 24px}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit;padding:0}
h1,h2,h3,p{margin:0}
.top{position:sticky;top:0;z-index:5;margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;background:rgba(247,246,252,.85);backdrop-filter:blur(14px)}
.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{display:flex;gap:9px;align-items:center;font-weight:800;font-size:20px;color:var(--ink)}
.logo i{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--ink),var(--ink2));color:#fff;display:grid;place-items:center;font-style:normal;box-shadow:0 4px 10px rgba(43,39,112,.3)}
.city{background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:700}
.seg{display:flex;background:var(--chip);border-radius:16px;padding:4px}
.seg button{flex:1;padding:10px;border-radius:12px;font-weight:700;font-size:13px;color:var(--slate)}
.seg .on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(43,39,112,.12)}
.hero{margin:16px 0;padding:20px;border-radius:26px;color:#fff;background:linear-gradient(135deg,var(--ink),var(--ink2));box-shadow:0 10px 24px rgba(43,39,112,.3);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-50px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero h2{font-size:25px;font-weight:800;margin:10px 0}
.hero small{display:inline-block;background:rgba(255,255,255,.16);border-radius:99px;padding:5px 10px;font-weight:700;font-size:11px}
.hero p{font-size:12.5px;color:rgba(238,234,254,.9)}
.lab{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 2px 8px}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 13px;font-size:13px;font-weight:600;color:var(--slate2)}
.chip.on{background:linear-gradient(135deg,var(--ink),var(--ink2));color:#fff;border-color:transparent;box-shadow:0 3px 8px rgba(43,39,112,.25)}
.card{background:#fff;border:1px solid rgba(43,39,112,.05);border-radius:22px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(43,39,112,.05),0 10px 20px rgba(43,39,112,.08);cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.99)}
.flex{display:flex;align-items:center;gap:14px}
.grow{flex:1;min-width:0}
.av{position:relative;display:inline-grid;place-items:center;flex:none;border-radius:36%;overflow:hidden;color:#fff;font-weight:800;box-shadow:0 4px 8px rgba(91,80,224,.3)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.c{border-radius:50%}
.nm{font-weight:800;font-size:17px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--slate);margin:2px 0 5px}
.pill{display:inline-block;background:var(--chip);border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:700}
.ring{--v:0;width:48px;height:48px;border-radius:50%;background:conic-gradient(var(--ink2) calc(var(--v)*1%),var(--lav) 0);display:grid;place-items:center;flex:none}
.ring b{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:13px;color:var(--ink);line-height:1;text-align:center}
.ring b small{display:block;font-size:7px;color:var(--muted)}
.bio{margin:14px 0 10px;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--chip);border-radius:99px;padding:5px 10px;font-size:11.5px;font-weight:500}
.tag.sh{background:var(--lav);color:var(--ink);font-weight:700}
.quote{background:var(--chip);border-radius:14px;padding:12px;margin-top:12px;font-size:12.5px}
.quote span{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:3px}
.foot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);margin-top:14px;padding-top:12px;font-size:12.5px;font-weight:600;color:var(--slate)}
.badge{background:rgba(245,179,1,.14);border-radius:99px;padding:4px 9px;font-size:12px;font-weight:800;color:var(--ink)}
.badge s{text-decoration:none;color:var(--star)}
.btn{border-radius:22px;padding:10px 15px;font-weight:700;font-size:13px;background:linear-gradient(180deg,#FF9E8A,var(--coral));color:#fff;box-shadow:0 5px 10px rgba(255,122,107,.35)}
.btn.mint{background:rgba(52,211,153,.16);color:var(--mintd);box-shadow:none}
.btn.lav{background:var(--lav);color:var(--ink);box-shadow:none}
.btn.full{width:100%;padding:16px;border-radius:18px;font-size:16px}
.sp{margin-left:auto}
.off{color:#CFD5E3}.st{color:var(--star);letter-spacing:1px;font-size:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav div{display:flex;width:100%;max-width:520px}
nav button{flex:1;padding:10px 0 8px;font-size:11px;font-weight:700;color:var(--muted)}
nav button.on{color:var(--ink)}
nav em{display:block;font-style:normal;font-size:20px}
#sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(20,18,60,.45)}
#sheet.show{display:block}
.pane{position:absolute;left:0;right:0;bottom:0;top:40px;max-width:520px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;overflow-y:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh-hero{height:124px;background:linear-gradient(135deg,var(--ink),var(--ink2));border-radius:26px 26px 0 0;position:relative}
.sh-hero .av{position:absolute;left:50%;bottom:-52px;transform:translateX(-50%);border:4px solid #fff;box-sizing:content-box}
.x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:16px}
.body{padding:62px 22px 100px;text-align:center}
.body h2{font-size:25px;font-weight:800;color:var(--ink)}
.stats{display:flex;background:#fff;border-radius:20px;padding:14px 0;margin:18px 0;box-shadow:0 10px 20px rgba(43,39,112,.08)}
.stats div{flex:1;border-right:1px solid var(--line);font-size:11.5px;color:var(--slate)}
.stats div:last-child{border:0}.stats b{display:block;font-size:20px;color:var(--ink)}
.left{text-align:left}
.sum{display:flex;gap:20px;align-items:center;background:#fff;border-radius:22px;padding:18px;margin:10px 0 12px}
.sum big{display:block;font-size:40px;font-weight:800;color:var(--ink);text-align:center;line-height:1.1}
.bars{flex:1}.bars div{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;margin:5px 0}
.bars i{flex:1;height:6px;border-radius:9px;background:var(--chip);overflow:hidden}.bars u{display:block;height:100%;background:var(--star)}
.rev{background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 8px 18px rgba(43,39,112,.07)}
.rev p{margin:8px 0;font-size:13.5px}
.ctx{background:var(--lav);color:var(--ink2);border-radius:99px;padding:4px 9px;font-size:11px;font-weight:700}
.help{font-size:11.5px;font-weight:700;color:var(--slate);margin-left:auto}.help.on{color:var(--mintd)}
.bar{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;padding:12px 22px calc(12px + env(safe-area-inset-bottom));background:rgba(247,246,252,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.ev{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:12px;margin-bottom:12px;box-shadow:0 8px 18px rgba(43,39,112,.08)}
.date{width:54px;height:58px;border-radius:16px;background:var(--lav);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:20px;line-height:1;text-align:center}
.date small{font-size:9.5px;color:var(--ink2);letter-spacing:.1em}
.vote{width:54px;padding:9px 0;border-radius:15px;border:1.5px solid var(--line);font-weight:800;font-size:13px;color:var(--slate)}
.vote.on{border-color:var(--mint);background:rgba(52,211,153,.16);color:var(--mintd)}
h1.t{font-size:28px;font-weight:800;color:var(--ink);margin:18px 0 2px}
.empty{text-align:center;padding:30px;color:var(--slate)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<nav><div id="nav"></div></nav>
<script>
const DATA = {"people":[{"name":"Maya Santos","age":27,"city":"Lisbon","distance":"2 km away","code":"INFJ","type":"Diplomat","bio":"Weekend comic-shop wanderer. Looking for someone to split a Con weekend with.","tags":["Comics","Movies","Art"],"compat":92,"tone":0,"portrait":"women/44"},{"name":"Daniel Okafor","age":31,"city":"Lisbon","distance":"4 km away","code":"INTP","type":"Analyst","bio":"Board game café regular. I'll teach you Catan, you teach me patience.","tags":["Board Games","Gaming","Books"],"compat":84,"tone":1,"portrait":"men/32"},{"name":"Priya Raman","age":33,"city":"Lisbon","distance":"6 km away","code":"ENFJ","type":"Diplomat","bio":"Trail runner, new in town. Sunday hikes followed by pastries.","tags":["Hiking","Fitness","Cooking"],"compat":79,"tone":2,"portrait":"women/68"},{"name":"Tomás Pereira","age":29,"city":"Lisbon","distance":"3 km away","code":"ISFJ","type":"Sentinel","bio":"Anime nights and ramen runs. Always up for a convention road trip.","tags":["Anime","Gaming","Movies"],"compat":76,"tone":3,"portrait":"men/75"},{"name":"Aisha Khan","age":26,"city":"Lisbon","distance":"5 km away","code":"ESTP","type":"Explorer","bio":"Photographer chasing golden hour. Bring a book, I'll bring the camera.","tags":["Photography","Hiking","Books"],"compat":73,"tone":1,"portrait":"women/26"},{"name":"Lucas Meyer","age":35,"city":"Lisbon","distance":"7 km away","code":"ISTJ","type":"Sentinel","bio":"Cooks for friends, plays strategy games, hosts a monthly movie night.","tags":["Board Games","Movies","Cooking"],"compat":70,"tone":2,"portrait":"men/46"},{"name":"Kenji Tanaka","age":30,"city":"Tokyo","distance":"9,800 km away","code":"INTJ","type":"Analyst","bio":"Manga collector and retro-game tinkerer. Happy to swap recommendations online.","tags":["Anime","Comics","Gaming"],"compat":88,"tone":3,"portrait":"men/22"},{"name":"Lena Fischer","age":28,"city":"Berlin","distance":"2,300 km away","code":"ENFP","type":"Explorer","bio":"Museum hopper and weekend hiker. Planning a Lisbon trip next spring.","tags":["Hiking","Movies","Art"],"compat":81,"tone":0,"portrait":"women/65"},{"name":"Sofia Rossi","age":32,"city":"Rome","distance":"1,800 km away","code":"ESFJ","type":"Sentinel","bio":"Book club founder who cooks too much pasta. Let's trade reading lists.","tags":["Books","Cooking","Board Games"],"compat":77,"tone":1,"portrait":"women/33"},{"name":"Ben Carter","age":34,"city":"Toronto","distance":"5,700 km away","code":"ENTP","type":"Analyst","bio":"Runs a weekly online game night. Comics, co-op, and terrible puns.","tags":["Comics","Gaming","Board Games"],"compat":74,"tone":2,"portrait":"men/52"},{"name":"Inês Carvalho","age":28,"city":"Lisbon","distance":"1 km away","code":"ISFP","type":"Explorer","bio":"Ceramics on weekdays, tile-hunting on weekends. Always up for a gallery crawl in Alfama.","tags":["Art","Photography","Cooking"],"compat":86,"tone":2,"portrait":"women/79"},{"name":"Rafael Costa","age":32,"city":"Lisbon","distance":"3 km away","code":"ENTJ","type":"Analyst","bio":"Runs a Thursday tabletop RPG night above a bookshop in Príncipe Real. We always need one more player.","tags":["Gaming","Board Games","Books"],"compat":82,"tone":3,"portrait":"men/86"},{"name":"Mei Lin Wong","age":25,"city":"Lisbon","distance":"4 km away","code":"INFP","type":"Diplomat","bio":"Illustrator who lives in sketchbooks. Looking for cinema buddies and anyone who loves a good webcomic.","tags":["Comics","Art","Movies"],"compat":90,"tone":1,"portrait":"women/90"},{"name":"Jonas Berg","age":36,"city":"Lisbon","distance":"8 km away","code":"ISTP","type":"Explorer","bio":"Swedish expat. Surf at dawn, long hikes after. Will trade surf tips for good coffee spots.","tags":["Hiking","Fitness","Photography"],"compat":71,"tone":0,"portrait":"men/11"},{"name":"Camila Duarte","age":30,"city":"Lisbon","distance":"2 km away","code":"ENFJ","type":"Diplomat","bio":"Cooks for twelve on a good Sunday. Anime marathons and a very big pot of caldo verde.","tags":["Cooking","Anime","Movies"],"compat":78,"tone":3,"portrait":"women/17"},{"name":"Omar Haddad","age":29,"city":"Lisbon","distance":"5 km away","code":"INTP","type":"Analyst","bio":"Developer by day, retro-console collector by night. Currently hunting for a working SNES.","tags":["Gaming","Anime","Comics"],"compat":80,"tone":2,"portrait":"men/15"},{"name":"Beatriz Nunes","age":34,"city":"Lisbon","distance":"6 km away","code":"ESTJ","type":"Sentinel","bio":"Bookseller organising a monthly silent-reading night at a café in Graça.","tags":["Books","Movies","Board Games"],"compat":68,"tone":1,"portrait":"women/47"},{"name":"Gabriel Martins","age":26,"city":"Lisbon","distance":"3 km away","code":"ESFP","type":"Explorer","bio":"Climbing-gym regular, learning to cook from scratch, and a menace at anime-opening karaoke.","tags":["Fitness","Anime","Cooking"],"compat":75,"tone":0,"portrait":"men/68"},{"name":"Oliver Hughes","age":33,"city":"London","distance":"1,650 km away","code":"ISTJ","type":"Sentinel","bio":"Hosts a weekly video-call game night. Always happy to teach a new board game.","tags":["Board Games","Gaming","Movies"],"compat":75,"tone":1,"portrait":"men/45"},{"name":"Zoe Alvarez","age":27,"city":"Mexico City","distance":"9,500 km away","code":"ENFJ","type":"Diplomat","bio":"Zines, lucha libre posters and comic cons. Always scheming a trip to Europe.","tags":["Comics","Art","Photography"],"compat":87,"tone":3,"portrait":"women/21"},{"name":"Min-jun Park","age":29,"city":"Seoul","distance":"10,000 km away","code":"ENTJ","type":"Analyst","bio":"Webtoon editor who plays co-op games after work. Swaps recommendations at any hour.","tags":["Comics","Gaming","Anime"],"compat":85,"tone":2,"portrait":"men/62"},{"name":"Chloe Bennett","age":31,"city":"Sydney","distance":"17,500 km away","code":"ESFP","type":"Explorer","bio":"Coastal walker and amateur photographer. Dawn swims, sunset hikes, long-distance book swaps.","tags":["Hiking","Photography","Books"],"compat":76,"tone":0,"portrait":"women/55"},{"name":"Thandiwe Mokoena","age":28,"city":"Cape Town","distance":"8,400 km away","code":"INFP","type":"Diplomat","bio":"Film-school grad writing her first feature. Trading watchlists and favourite scripts.","tags":["Movies","Books","Art"],"compat":83,"tone":1,"portrait":"women/12"},{"name":"Mateus Almeida","age":30,"city":"São Paulo","distance":"7,900 km away","code":"ESFJ","type":"Sentinel","bio":"Feijoada host, Brazilian comics fan and board game evangelist.","tags":["Cooking","Comics","Board Games"],"compat":72,"tone":3,"portrait":"men/85"},{"name":"Anouk de Vries","age":32,"city":"Amsterdam","distance":"1,850 km away","code":"ISFJ","type":"Sentinel","bio":"Cyclist and bookbinder. Happy to swap reading lists, letters and weekend rides.","tags":["Books","Art","Fitness"],"compat":74,"tone":2,"portrait":"women/63"},{"name":"Noah Sullivan","age":35,"city":"New York","distance":"5,400 km away","code":"ISTP","type":"Explorer","bio":"Trail runner and film nerd. Hosts a monthly 'so bad it's good' movie night over video call.","tags":["Fitness","Movies","Hiking"],"compat":70,"tone":0,"portrait":"men/19"}],"reviews":{"Maya Santos":[{"author":"Hana Ito","portrait":"women/9","rating":5,"context":"Comic Meet-Up","when":"2 weeks ago","text":"Maya found the one stall with the out-of-print issues I had been hunting for years. Easy company, and she remembered everything I said about my favourite artists.","helpful":14},{"author":"Diogo Ferreira","portrait":"men/7","rating":5,"context":"Cinema Ideal","when":"1 month ago","text":"Went to a Ghibli double feature together. We kept talking through dinner and ended up staying until the staff were stacking chairs.","helpful":9},{"author":"Sam Whitaker","portrait":"men/29","rating":4,"context":"Art walk","when":"2 months ago","text":"Lovely person with strong opinions about every gallery we visited, which I enjoyed. We started a bit late because of the tram, but she messaged ahead.","helpful":3},{"author":"Rita Gomes","portrait":"women/36","rating":5,"context":"Comic Meet-Up","when":"3 months ago","text":"Felt comfortable straight away. She introduced me to her friends and made sure I wasn't standing alone at the table.","helpful":6}],"Daniel Okafor":[{"author":"Marta Silva","portrait":"women/5","rating":5,"context":"Taberna Dados","when":"3 weeks ago","text":"Taught our whole table Catan with endless patience. Never once made anyone feel slow.","helpful":11},{"author":"Pedro Lopes","portrait":"men/3","rating":4,"context":"Game night","when":"6 weeks ago","text":"Great host and very sharp at strategy games. The one catch is that he takes a long time on his turn. Still a good evening.","helpful":7},{"author":"Emma Clarke","portrait":"women/14","rating":5,"context":"Board Game Saturday","when":"2 months ago","text":"I had never played anything beyond Monopoly. He started me on Azul and I have since bought it. Would happily lose to him again.","helpful":8}],"Priya Raman":[{"author":"João Mendes","portrait":"men/9","rating":5,"context":"Sunday hike","when":"1 week ago","text":"Pace was perfect and she brought a flask of chai for the whole group. The pastry stop in Belém afterwards was the best part.","helpful":18},{"author":"Laura Pinto","portrait":"women/24","rating":5,"context":"Trail run","when":"3 weeks ago","text":"Newish to the city and she still knew the best routes. Waited at the top for me twice without a hint of impatience.","helpful":10},{"author":"Chris Dalton","portrait":"men/36","rating":4,"context":"Sunday hike","when":"2 months ago","text":"Brilliant company. The route was a bit longer than advertised, so bring snacks.","helpful":5}],"Tomás Pereira":[{"author":"Rui Barbosa","portrait":"men/4","rating":5,"context":"Anime night","when":"2 weeks ago","text":"Hosted at his place with far too much food. Great taste in series and he never spoiled a single plot twist.","helpful":7},{"author":"Ana Teixeira","portrait":"women/8","rating":4,"context":"Ramen run","when":"5 weeks ago","text":"Fun and chatty. Took us to a ramen place I would never have found. A bit quiet at first, warms up quickly.","helpful":4},{"author":"Kai Nakamura","portrait":"men/13","rating":5,"context":"Convention road trip","when":"3 months ago","text":"Shared a car to the Amadora comic fair. Good playlist, good snacks, zero drama.","helpful":9}],"Aisha Khan":[{"author":"Nuno Ribeiro","portrait":"men/16","rating":5,"context":"Golden hour walk","when":"10 days ago","text":"Aisha spotted light I would have walked straight past. She gave me a few quick framing tips without making it feel like a lesson.","helpful":13},{"author":"Clara Vidal","portrait":"women/30","rating":5,"context":"Miradouro meetup","when":"1 month ago","text":"Showed up with a thermos and a spare camera strap because mine had broken. Thoughtful and a lot of fun.","helpful":12},{"author":"Tim Brandt","portrait":"men/18","rating":4,"context":"Photo walk","when":"2 months ago","text":"Great eye, great conversation. We lost the light early so it turned into a café stop, which I didn't mind.","helpful":2}],"Lucas Meyer":[{"author":"Sara Antunes","portrait":"women/2","rating":5,"context":"Movie night","when":"3 weeks ago","text":"His monthly movie night is properly organised: a theme, a shared playlist before the film and a very good lasagne.","helpful":8},{"author":"Henrik Olsen","portrait":"men/20","rating":4,"context":"Strategy night","when":"7 weeks ago","text":"Welcoming host. Rules explanations run long, but he checks in to see if everyone is keeping up.","helpful":5},{"author":"Joana Reis","portrait":"women/13","rating":5,"context":"Movie night","when":"3 months ago","text":"Warm without being over the top. I came alone and left having made two new friends.","helpful":10}],"Kenji Tanaka":[{"author":"Felipe Rocha","portrait":"men/23","rating":5,"context":"Manga swap","when":"2 weeks ago","text":"Sent me a whole reading list with notes on where to start each series. Time zones are hard and he still stayed up for the call.","helpful":9},{"author":"Nina Petrova","portrait":"women/3","rating":4,"context":"Retro gaming chat","when":"6 weeks ago","text":"Really knowledgeable and generous with recommendations. Replies can take a day, which makes sense with the time difference.","helpful":3},{"author":"Alex Moreau","portrait":"men/10","rating":5,"context":"Co-op night","when":"2 months ago","text":"Patient while teaching me a game he has obviously played hundreds of times.","helpful":6}],"Lena Fischer":[{"author":"Isabel Moura","portrait":"women/6","rating":5,"context":"Video call","when":"1 week ago","text":"Warm, curious, asks real questions. We have already sketched out a gallery crawl for when she visits Lisbon.","helpful":7},{"author":"Dev Patel","portrait":"men/12","rating":5,"context":"Film chat","when":"5 weeks ago","text":"Her recommendations were spot on. My watchlist is now far too long, thanks Lena.","helpful":4},{"author":"Mia Larsen","portrait":"women/19","rating":4,"context":"Online hangout","when":"3 months ago","text":"Easy to talk to and very enthusiastic. A bit chaotic about scheduling, but she makes up for it.","helpful":2}],"Sofia Rossi":[{"author":"Teresa Faria","portrait":"women/1","rating":5,"context":"Book swap","when":"3 weeks ago","text":"She mailed me a novel she loved with a handwritten note inside. Lovely gesture.","helpful":15},{"author":"Michael Doyle","portrait":"men/24","rating":5,"context":"Online book club","when":"6 weeks ago","text":"Runs the discussion really well. Keeps it friendly and makes sure the quieter people get a say.","helpful":8},{"author":"Elif Aydin","portrait":"women/28","rating":4,"context":"Reading list trade","when":"2 months ago","text":"Great taste. A few of her picks were heavier than I was in the mood for, but I'm glad I read them.","helpful":3}],"Ben Carter":[{"author":"Gustavo Lima","portrait":"men/25","rating":5,"context":"Online game night","when":"2 weeks ago","text":"The puns are terrible and I looked forward to every one. Good at making sure nobody gets left out of co-op games.","helpful":10},{"author":"Priscila Rangel","portrait":"women/20","rating":4,"context":"Game night","when":"5 weeks ago","text":"Fun group and well organised. It starts a bit later than planned, so don't panic if you are alone on the call for ten minutes.","helpful":6},{"author":"Owen Price","portrait":"men/14","rating":5,"context":"Comics chat","when":"3 months ago","text":"Pulled up half a dozen indie titles I had never heard of. Real enthusiast.","helpful":4}],"Inês Carvalho":[{"author":"Carolina Matos","portrait":"women/16","rating":5,"context":"Gallery crawl","when":"1 week ago","text":"Took me to galleries I would never have spotted alone and knew the owners by name. Genuinely kind.","helpful":12},{"author":"Vasco Neves","portrait":"men/6","rating":5,"context":"Ceramics studio","when":"1 month ago","text":"Showed me how to throw a wobbly little bowl. Lots of laughing, zero pressure.","helpful":9},{"author":"Hannah Fox","portrait":"women/32","rating":4,"context":"Tile hunt","when":"2 months ago","text":"Lovely day wandering for azulejos. She walks fast, so wear comfortable shoes.","helpful":5}],"Rafael Costa":[{"author":"Leonor Cabral","portrait":"women/10","rating":5,"context":"Thursday RPG night","when":"10 days ago","text":"First time ever playing tabletop. He kept it welcoming and my terrible character became everyone's favourite.","helpful":16},{"author":"Tiago Sá","portrait":"men/2","rating":5,"context":"Thursday RPG night","when":"5 weeks ago","text":"Excellent game master. Good pacing, great voices, and the bookshop setting is lovely.","helpful":11},{"author":"Ellie Warren","portrait":"women/22","rating":4,"context":"Board games","when":"2 months ago","text":"Warm and organised. The session ran past midnight, which was great fun but plan for a late night.","helpful":4},{"author":"Jorge Pacheco","portrait":"men/17","rating":5,"context":"RPG night","when":"4 months ago","text":"Always asks if anyone needs a break. Rare in a GM.","helpful":7}],"Mei Lin Wong":[{"author":"Ricardo Alves","portrait":"men/8","rating":5,"context":"Cinema","when":"2 weeks ago","text":"Mei Lin noticed details in the film I had completely missed. We swapped webcomic links all the way home.","helpful":8},{"author":"Sofia Gama","portrait":"women/4","rating":5,"context":"Sketch meetup","when":"6 weeks ago","text":"Brought extra pencils and a spare sketchbook for me. Quiet at first but really funny once she settles in.","helpful":11},{"author":"Jamal Reed","portrait":"men/21","rating":4,"context":"Webcomic chat","when":"3 months ago","text":"Friendly and creative. We only had an hour and I would happily have stayed longer.","helpful":3}],"Jonas Berg":[{"author":"Patrícia Dias","portrait":"women/18","rating":4,"context":"Sunrise surf","when":"3 weeks ago","text":"Very patient teaching a beginner and knows the beaches well. Not much of a talker before coffee, fair warning.","helpful":9},{"author":"Lukas Weber","portrait":"men/26","rating":5,"context":"Sintra hike","when":"6 weeks ago","text":"Laid-back, reliable, and kept the whole group safe on a slippery trail. Good photos too.","helpful":7},{"author":"Anna Kowalski","portrait":"women/37","rating":4,"context":"Coffee meetup","when":"2 months ago","text":"Gave me a list of coffee spots I am still working through. Straightforward and kind.","helpful":3}],"Camila Duarte":[{"author":"Hugo Santos","portrait":"men/5","rating":5,"context":"Sunday lunch","when":"2 weeks ago","text":"The caldo verde was unreal and she made sure everyone had seconds. Felt like being invited to a friend's family lunch.","helpful":17},{"author":"Yara Costa","portrait":"women/7","rating":5,"context":"Anime marathon","when":"5 weeks ago","text":"Comfortable sofas, snacks everywhere and zero judgement about how slowly I watch.","helpful":8},{"author":"Rob Lindqvist","portrait":"men/30","rating":4,"context":"Sunday lunch","when":"3 months ago","text":"Warm host. It was quite a crowd, so lively rather than quiet. Great if that is your thing.","helpful":4}],"Omar Haddad":[{"author":"Filipe Cunha","portrait":"men/1","rating":5,"context":"Retro game night","when":"1 week ago","text":"Hooked up a CRT and a whole shelf of cartridges. Properly nerdy in the best way.","helpful":12},{"author":"Maria Esteves","portrait":"women/11","rating":4,"context":"Coffee chat","when":"5 weeks ago","text":"Interesting and funny. Gets very deep into console trivia, so be ready to nod a lot.","helpful":6},{"author":"Ivan Petrov","portrait":"men/33","rating":5,"context":"SNES hunt","when":"2 months ago","text":"Went flea-market hunting with him and he haggled like a pro. Great day out.","helpful":5}],"Beatriz Nunes":[{"author":"Margarida Lobo","portrait":"women/15","rating":5,"context":"Silent reading night","when":"2 weeks ago","text":"Calm, cosy and perfectly organised. Exactly what I needed after a loud week.","helpful":13},{"author":"Daniel Kerr","portrait":"men/27","rating":4,"context":"Silent reading night","when":"7 weeks ago","text":"Lovely idea and she runs it well. A bit strict about the no-talking rule, but that is the point.","helpful":6},{"author":"Carla Brito","portrait":"women/25","rating":5,"context":"Bookshop visit","when":"3 months ago","text":"Recommended three books and every one landed.","helpful":9}],"Gabriel Martins":[{"author":"Miguel Torres","portrait":"men/28","rating":5,"context":"Climbing gym","when":"10 days ago","text":"Super encouraging. Spotted me on my first bouldering attempt and never made me feel like a beginner.","helpful":10},{"author":"Lucie Bernard","portrait":"women/29","rating":4,"context":"Anime karaoke","when":"1 month ago","text":"Hilarious and high energy. Probably not the one to pick if you want a quiet night.","helpful":8},{"author":"Alexei Volkov","portrait":"men/31","rating":5,"context":"Cooking night","when":"2 months ago","text":"We attempted risotto from scratch. It was Tomasz Wolski","portrait":"men/40","rating":5,"context":"Book swap","when":"2 weeks ago","text":"Shipped me a paperback with photos of her favourite coastal walks tucked inside. Thoughtful.","helpful":11},{"author":"Eva Lindgren","portrait":"women/42","rating":4,"context":"Video call","when":"6 weeks ago","text":"Cheerful and easy to chat with. Dawn calls are tough on Lisbon time, but she was flexible.","helpful":4},{"author":"Pablo Ortiz","portrait":"men/48","rating":5,"context":"Photo chat","when":"3 months ago","text":"Talked me through her favourite shots and why she took them. Inspiring.","helpful":6}],"Thandiwe Mokoena":[{"author":"Lucía Navarro","portrait":"women/43","rating":5,"context":"Script swap","when":"10 days ago","text":"Sent me pages of her feature to read and was generous about my notes. Smart, funny and gracious.","helpful":13},{"author":"Callum Reid","portrait":"men/42","rating":5,"context":"Watchlist trade","when":"1 month ago","text":"Her recommendations were all excellent. Now I owe her a list.","helpful":7},{"author":"Dina Moreira","portrait":"women/45","rating":4,"context":"Video call","when":"3 months ago","text":"Warm and engaging. The call ran over because we couldn't stop talking about films.","helpful":4}],"Mateus Almeida":[{"author":"Beto Carvalho","portrait":"men/43","rating":5,"context":"Board game call","when":"3 weeks ago","text":"Came with a feijoada recipe and a board game evangelism speech I wasn't expecting to enjoy. I did.","helpful":9},{"author":"Sandra Quaresma","portrait":"women/46","rating":4,"context":"Comics chat","when":"6 weeks ago","text":"Friendly, generous and very passionate about Brazilian comics. Sends voice notes rather than texts.","helpful":5},{"author":"Luc Martin","portrait":"men/44","rating":5,"context":"Online game night","when":"2 months ago","text":"Welcoming to newcomers.","helpful":3}],"Anouk de Vries":[{"author":"Greta Hoffmann","portrait":"women/48","rating":5,"context":"Letter swap","when":"2 weeks ago","text":"Her handwritten letters are works of art. Thoughtful, kind and surprisingly funny.","helpful":12},{"author":"Jelle Visser","portrait":"men/49","rating":4,"context":"Reading list swap","when":"5 weeks ago","text":"Brilliant recommendations. Replies take a few days, which suits the slow-letters idea.","helpful":3},{"author":"Naomi Cole","portrait":"women/49","rating":5,"context":"Book chat","when":"3 months ago","text":"The bookbinding talk was fascinating.","helpful":6}],"Noah Sullivan":[{"author":"Eddie Marsh","portrait":"men/51","rating":5,"context":"Bad movie night","when":"1 week ago","text":"The worst film we have ever picked and one of the best nights. A brilliant host over video.","helpful":9},{"author":"Katya Ivanova","portrait":"women/50","rating":4,"context":"Movie night","when":"5 weeks ago","text":"Funny and warm. A couple of his picks were truly awful, as advertised.","helpful":7},{"author":"Paulo Ramos","portrait":"men/47","rating":5,"context":"Trail chat","when":"2 months ago","text":"Great tips on trail running gear and no ego about it.","helpful":4}],"You":[{"author":"Maya Santos","portrait":"women/44","rating":5,"context":"Comic Meet-Up","when":"3 weeks ago","text":"Thoughtful, funny and easy to talk to. Made me feel at ease right away.","helpful":5},{"author":"Priya Raman","portrait":"women/68","rating":5,"context":"Sunday hike","when":"Oct 5","text":"Great hiking buddy. Kept a steady pace and shared snacks.","helpful":3},{"author":"Mateo Vargas","portrait":"men/41","rating":4,"context":"Board game night","when":"Sep 28","text":"Fun evening and very competitive in the best way. Would play again.","helpful":2}]},"events":[{"day":"16","month":"NOV","title":"Lisbon Comic Meet-Up","place":"Casa do Comum","base":127,"going":24,"voted":true},{"day":"23","month":"NOV","title":"Ghibli Watch Party","place":"Cinema Ideal","base":93,"going":31,"voted":true},{"day":"30","month":"NOV","title":"Board Game Saturday","place":"Taberna Dados","base":71,"going":18,"voted":false},{"day":"07","month":"DEC","title":"Sunset Hike · Sintra","place":"Pena Park","base":58,"going":12,"voted":false}]};
const {people, reviews, events} = DATA;
const ALL = ["Comics","Movies","Anime","Gaming","Board Games","Books","Hiking","Art","Fitness","Cooking","Photography"];
const TYPES = ["Analyst","Diplomat","Sentinel","Explorer"];
const HOME = "Lisbon";
const KEY = "kindred.web.v1";
const GR = ["linear-gradient(135deg,#6366F1,#A78BFA)","linear-gradient(135deg,#FB7185,#F59E0B)","linear-gradient(135deg,#34D399,#0EA5E9)","linear-gradient(135deg,#8B5CF6,#EC4899)"];
let S = {mine:["Comics","Movies","Board Games","Hiking"], req:["Priya Raman"], voted:events.filter(e=>e.voted).map(e=>e.title), help:[]};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
let ui = {tab:"discover", scope:"local", tags:[], type:null, open:null, all:false};

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const has = (a, v) => a.includes(v);
const toggle = (a, v) => has(a, v) ? a.filter(x => x !== v) : [...a, v];
const ini = n => n.split(" ").map(w => w[0]).join("");
const score = p => Math.min(99, Math.round(p.compat * .7 + p.tags.filter(t => has(S.mine, t)).length / p.tags.length * 30));
const revs = p => reviews[p.name] || [];
const sum = l => ({n:l.length, avg:l.length ? l.reduce((a,r) => a + r.rating, 0) / l.length : 0});
const stars = n => "★".repeat(n) + `<span class=off>${"★".repeat(5 - n)}</span>`;
const av = (name, portrait, size, i, c) =>
  `<span class="av${c ? " c" : ""}" style="width:${size}px;height:${size}px;background:${GR[i % 4]};font-size:${size * .32}px">${esc(ini(name))}<img loading=lazy alt="" src="https://randomuser.me/api/portraits/${portrait}.jpg" onerror="this.remove()"></span>`;
const badge = l => { const s = sum(l); return s.n ? `<span class=badge><s>★</s> ${s.avg.toFixed(1)} (${s.n})</span>` : ""; };
const byName = n => people.find(p => p.name === n);

function card(p) {
  const l = revs(p), top = [...l].sort((a,b) => b.helpful - a.helpful)[0];
  const c = p.tags.filter(t => has(S.mine, t)).length, r = has(S.req, p.name);
  return `<article class=card data-open="${esc(p.name)}">
    <div class=flex>${av(p.name, p.portrait, 60, p.tone)}
      <div class=grow><div class=nm>${esc(p.name)}, ${p.age}</div>
      <div class=sub>📍 ${esc(p.city)} · ${esc(p.distance)}</div><span class=pill>${p.code} · ${p.type}</span></div>
      <div class=ring style="--v:${score(p)}"><b><span>${score(p)}<small>match</small></span></b></div></div>
    <p class=bio>${esc(p.bio)}</p>
    <div class=tags>${p.tags.map(t => `<span class="tag${has(S.mine, t) ? " sh" : ""}">${t}</span>`).join("")}</div>
    ${top ? `<div class=quote>“${esc(top.text)}”<span>${esc(top.author.split(" ")[0])} · ${esc(top.context)}</span></div>` : ""}
    <div class=foot><span>${c ? "❤️" : "🤍"} ${c} in common</span>${badge(l)}
      <button class="btn sp${r ? " mint" : ""}" data-req="${esc(p.name)}">${r ? "✓ Requested" : "Send request"}</button></div></article>`;
}

function discover() {
  const mine = S.mine;
  const list = people.filter(p => ui.scope === "global" || p.city === HOME)
    .filter(p => !ui.tags.length || p.tags.some(t => has(ui.tags, t)))
    .filter(p => !ui.type || p.type === ui.type)
    .sort((a,b) => score(b) - score(a) || a.name.localeCompare(b.name));
  const near = people.filter(p => p.city === HOME && p.tags.some(t => has(mine, t))).length;
  const chips = (items, on, attr) => `<div class=row>${items.map(i => `<button class="chip${on(i) ? " on" : ""}" ${attr}="${i}">${i}</button>`).join("")}</div>`;
  return `<div class=top><div class=brand><div class=logo><i>✦</i>Kindred</div><span class=city>📍 ${HOME}</span></div>
    <div class=seg><button class="${ui.scope === "local" ? "on" : ""}" data-scope=local>Local City · ${people.filter(p => p.city === HOME).length}</button>
    <button class="${ui.scope === "global" ? "on" : ""}" data-scope=global>Global · ${people.length}</button></div></div>
    <div class=hero><small>🛡 Every member is verified</small><h2>Friends who actually<br>get you</h2>
    <p>${near} people in ${HOME} share your interests</p></div>
    <div class=lab>Interests</div>${chips(ALL, i => has(ui.tags, i), "data-tag")}
    <div class=lab>Personality</div>${chips(TYPES, i => ui.type === i, "data-type")}
    <div class=lab>${list.length} people · best match first</div>
    ${list.length ? list.map(card).join("") : "<div class=empty>No one matches those filters yet.</div>"}`;
}

function events_() {
  const mx = Math.max(...events.map(e => e.base + (has(S.voted, e.title) ? 1 : 0)));
  return `<h1 class=t>Community Events</h1><p style="color:var(--slate)">Vote for what happens in ${HOME} next.</p><div style="height:14px"></div>
  ${events.map(e => { const v = has(S.voted, e.title), n = e.base + (v ? 1 : 0);
    return `<div class=ev><div class=date><span>${e.day}<br><small>${e.month}</small></span></div>
    <div class=grow><div class=nm style="font-size:15px">${esc(e.title)}</div><div class=sub>📍 ${esc(e.place)} · ${e.going} going</div>
    <div class=bars><i><u style="width:${n / mx * 100}%"></u></i></div></div>
    <button class="vote${v ? " on" : ""}" data-vote="${esc(e.title)}">▲<br>${n}</button></div>`; }).join("")}`;
}

function revCard(r, p, own) {
  const id = (p ? p.name : "You") + "#" + r.author, h = has(S.help, id), n = r.helpful + (h ? 1 : 0);
  return `<div class=rev><div class=flex style="gap:10px">${av(r.author, r.portrait, 38, r.author.length, 1)}
    <div class="grow left"><b style="color:var(--ink)">${esc(r.author)}</b><div><span class=st>${stars(r.rating)}</span> <span style="font-size:11.5px;color:var(--muted)">· ${esc(r.when)}</span></div></div></div>
    <p class=left>${esc(r.text)}</p><div class=flex style="gap:8px"><span class=ctx>${p && p.city !== HOME ? "📹" : "👥"} ${esc(r.context)}</span>
    ${own ? "" : `<button class="help${h ? " on" : ""}" data-help="${esc(id)}">👍 Helpful${n ? " · " + n : ""}</button>`}</div></div>`;
}

function summary(l) {
  const s = sum(l), cnt = k => l.filter(r => r.rating === k).length;
  return `<div class=sum><div><big>${s.avg.toFixed(1)}</big><span class=st>${stars(Math.round(s.avg))}</span><div style="font-size:11.5px">${s.n} reviews</div></div>
  <div class=bars>${[5,4,3,2,1].map(k => `<div>${k}<i><u style="width:${cnt(k) / Math.max(s.n, 1) * 100}%"></u></i></div>`).join("")}</div></div>`;
}

function profileTab() {
  const mine = reviews["You"] || [], s = sum(mine);
  return `<h1 class=t>Your profile</h1>
  <div class=card style="cursor:default;text-align:center"><div class=sub>Avg. rating received</div><div class=nm style="font-size:30px">${s.avg.toFixed(1)}</div>
  <div class=sub>${S.voted.length} votes cast · ${S.req.length} requests sent</div></div>
  <div class=lab>My interests · tap to edit, matches update instantly</div>
  <div class=tags style="gap:8px">${ALL.map(i => `<button class="chip${has(S.mine, i) ? " on" : ""}" data-int="${i}">${i}</button>`).join("")}</div>
  <div class=lab>What people say about you</div>${summary(mine)}${mine.map(r => revCard(r, null, true)).join("")}`;
}

function sheet() {
  const p = byName(ui.open);
  if (!p) return "";
  const l = revs(p), r = has(S.req, p.name), c = p.tags.filter(t => has(S.mine, t)).length, s = sum(l);
  const vis = ui.all ? l : l.slice(0, 3);
  return `<div class=pane id=pane><div class=sh-hero><button class=x data-close>✕</button>${av(p.name, p.portrait, 104, p.tone)}</div>
  <div class=body><h2>${esc(p.name)}, ${p.age}</h2><div class=sub>📍 ${esc(p.city)} · ${esc(p.distance)}</div><span class=pill>${p.code} · ${p.type}</span>
  <div class=stats><div><b>${score(p)}%</b>Match</div><div><b>${s.n ? s.avg.toFixed(1) + " ★" : "New"}</b>Rating</div><div><b>${c}/${p.tags.length}</b>In common</div></div>
  <div class=left><div class=lab>About ${esc(p.name.split(" ")[0])}</div><p>${esc(p.bio)}</p>
  <div class=lab>${c ? c + " interests in common" : "Interests"}</div><div class=tags>${p.tags.map(t => `<span class="tag${has(S.mine, t) ? " sh" : ""}">${t}</span>`).join("")}</div>
  <div class=flex><div class=lab style="margin-right:auto">Reviews</div>${l.length > 3 ? `<button class=lab style="color:var(--ink2)" data-all>${ui.all ? "Show less" : "See all " + l.length}</button>` : ""}</div>
  ${l.length ? summary(l) + vis.map(x => revCard(x, p)).join("") : "<div class=empty>No reviews yet.</div>"}</div></div>
  <div class=bar><button class="btn full${r ? " lav" : ""}" data-req="${esc(p.name)}">${r ? "Cancel request" : "Send request to " + esc(p.name.split(" ")[0])}</button></div></div>`;
}

function render() {
  const old = document.getElementById("pane"), top = old ? old.scrollTop : 0;
  document.getElementById("app").innerHTML = ui.tab === "discover" ? discover() : ui.tab === "events" ? events_() : profileTab();
  const sh = document.getElementById("sheet");
  sh.className = ui.open ? "show" : "";
  sh.innerHTML = ui.open ? sheet() : "";
  const np = document.getElementById("pane"); if (np) np.scrollTop = top;
  document.getElementById("nav").innerHTML = [["discover","🧭","Discover"],["events","📅","Events"],["profile","👤","Profile"]]
    .map(([k, i, t]) => `<button class="${ui.tab === k ? "on" : ""}" data-tab="${k}"><em>${i}</em>${t}</button>`).join("");
}

document.addEventListener("click", e => {
  const d = e.target.closest("[data-open],[data-req],[data-scope],[data-tag],[data-type],[data-tab],[data-vote],[data-help],[data-int],[data-close],[data-all]");
  if (e.target.id === "sheet") ui.open = null;
  if (!d) return render();
  const D = d.dataset;
  if (D.req) { S.req = toggle(S.req, D.req); save(); e.stopPropagation(); }
  else if (D.open) { ui.open = D.open; ui.all = false; }
  else if ("close" in D) ui.open = null;
  else if ("all" in D) ui.all = !ui.all;
  else if (D.scope) ui.scope = D.scope;
  else if (D.tag) ui.tags = toggle(ui.tags, D.tag);
  else if (D.type) ui.type = ui.type === D.type ? null : D.type;
  else if (D.tab) { ui.tab = D.tab; scrollTo(0, 0); }
  else if (D.vote) { S.voted = toggle(S.voted, D.vote); save(); }
  else if (D.help) { S.help = toggle(S.help, D.help); save(); }
  else if (D.int) { S.mine = toggle(S.mine, D.int); save(); }
  render();
});
render();
</script>
</body>
</html>
